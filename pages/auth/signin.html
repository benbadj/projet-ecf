
<div class="hero-scene text-white">
        <div class="container texte-center">
            <h1>Connexion</h1>
        </div>
</div>
<div class="container">
    <form>
        <div class="mb-3">
          <label for="EmailInput" class="form-label">Email</label>
          <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.fr" name="Email" autocomplete="email"> 
        </div>
        <div class="mb-3">
          <label for="PasswordInput" class="form-label">Mot de passe</label>
          <input type="password" class="form-control is-invalid" id="PasswordInput" name="Password" autocomplete="current-password">
          <div class="invalid-feedback">
            Votre adresse mail ou votre mot de pass n'est pas correct
          </div>
        </div>
        <div class="text-center">
            <button type="button" class="btn btn-primary" id="signinbtnInput">Connexion</button>
        </div>
    </form>
    <div class="text-center pt-3">
        <a href="/signup">Vous n’avez pas de compte ? Inscrivez-vous ici !</a>
    </div>
</div>

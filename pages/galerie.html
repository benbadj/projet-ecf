<div class="modal fade" id="ajouterPhotoModal" tabindex="-1" aria-labelledby="ajouterPhotoModalLabel" aria-hidden="true">

        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="NamePhotoInput" class="form-label">Titre de la photo</label>
            <input type="text" class="form-control" id="NamePhotoInput" placeholder="Entrez le titre de la photo">
          </div>
          <div class="mb-3">
            <label for="ImageInput" class="form-label">Image</label>
            <input type="file" class="form-control" id="ImageInput" placeholder="ajouter une photo">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">fermer</button>
